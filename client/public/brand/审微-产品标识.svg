<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="审微 · ShenWei">
  <!--
    审微 · ShenWei (SafeSpot) 产品 favicon（鹿溪 CI）
    - 鹿溪绿底 #0D5E42：实验室品牌
    - 光学分划 / 准星：审视细末
    - 标题金隐患点 #F1C40F：命中热区
    - 溪流 #00D2FF：防患于未萌
    - 源启星：察于至微
  -->
  <defs>
    <linearGradient id="sw-bg" x1="3" y1="2" x2="29" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#127A55"/>
      <stop offset="100%" stop-color="#0D5E42"/>
    </linearGradient>
    <linearGradient id="sw-stream" x1="5" y1="24" x2="27" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#00D2FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7CF0FF" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#sw-bg)"/>
  <circle cx="9" cy="8" r="6.5" fill="#ffffff" opacity="0.06"/>

  <circle cx="16" cy="14.4" r="6.6" fill="#F5F7FA" opacity="0.96"/>
  <circle cx="16" cy="14.4" r="6.6" fill="none" stroke="#0A3F2D" stroke-opacity="0.12"/>
  <circle cx="16" cy="14.4" r="5.2" fill="none" stroke="#0D5E42" stroke-width="0.9"/>
  <g stroke="#0D5E42" stroke-width="1.15" stroke-linecap="butt">
    <line x1="16" y1="8.6" x2="16" y2="11.6"/>
    <line x1="16" y1="17.2" x2="16" y2="20.2"/>
    <line x1="8.6" y1="14.4" x2="11.6" y2="14.4"/>
    <line x1="20.4" y1="14.4" x2="23.4" y2="14.4"/>
  </g>
  <circle cx="19.6" cy="16.8" r="1.85" fill="#F1C40F"/>

  <path d="M5.5 26.2 C9 24.8, 12.5 27.1, 16 25.9 C19.2 24.8, 22.5 25.6, 26.5 24.9"
        fill="none" stroke="url(#sw-stream)" stroke-width="1.45" stroke-linecap="round"/>

  <g transform="translate(24.2 7.2)">
    <path d="M0-2.1 L0.45-0.45 L2.1 0 L0.45 0.45 L0 2.1 L-0.45 0.45 L-2.1 0 L-0.45-0.45 Z" fill="#00D2FF"/>
    <circle cx="0" cy="0" r="0.45" fill="#F5F7FA"/>
  </g>
