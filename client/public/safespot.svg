<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SafeSpot">
  <title>SafeSpot</title>
  <defs>
    <radialGradient id="ss-spot" cx="38%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#F3C45A"/>
      <stop offset="52%" stop-color="#E39B2E"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
  </defs>
  <!-- instrument housing -->
  <circle cx="32" cy="32" r="30.5" fill="#2A3338"/>
  <circle cx="32" cy="32" r="28.4" fill="none" stroke="#1A2226" stroke-width="0.55"/>
  <circle cx="32" cy="32" r="26.6" fill="none" stroke="#3D484E" stroke-width="0.4"/>
  <circle cx="32" cy="32" r="24.8" fill="none" stroke="#1A2226" stroke-width="0.35"/>
  <!-- optical field -->
  <circle cx="32" cy="32" r="20.6" fill="#F3EFE6"/>
  <circle cx="32" cy="32" r="21.7" fill="none" stroke="#2F7A73" stroke-width="1.55"/>
  <circle cx="32" cy="32" r="20.15" fill="none" stroke="#C4845A" stroke-width="0.85"/>
  <!-- reticle: open center, cardinal ticks -->
  <g stroke="#2F7A73" stroke-width="1.25" stroke-linecap="butt">
    <line x1="32" y1="13.6" x2="32" y2="22.2"/>
    <line x1="32" y1="41.8" x2="32" y2="50.4"/>
    <line x1="13.6" y1="32" x2="22.2" y2="32"/>
    <line x1="41.8" y1="32" x2="50.4" y2="32"/>
  </g>
  <!-- the spotted finding -->
  <circle cx="40.4" cy="36.8" r="4.55" fill="url(#ss-spot)"/>
</svg>
