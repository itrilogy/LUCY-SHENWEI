services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:-please-change-session-secret}
      ADMIN_PIN: ${ADMIN_PIN:-please-change-pin}
      ALLOW_INSECURE: ${ALLOW_INSECURE:-1}
    volumes:
      - safespot-data:/app/server/data
    restart: unless-stopped

volumes:
  safespot-data:
